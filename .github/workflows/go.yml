name: Go blog
on:
  push:
    paths: ['go/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/go.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_DB: blog_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: go
    env:
      TEST_DATABASE_URL: postgres://blog:ci-test-only@localhost:5432/blog_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: go build ./cmd/blog
